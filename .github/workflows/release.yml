name: Release tarball

# Builds the frontend and attaches a prebuilt plugin archive to the GitHub
# release, so the plugin can be installed without a Node toolchain:
#
#   tar -xzf redmine_gtt-vX.Y.Z.tar.gz -C path/to/redmine/plugins/
#
# The archive contains the tracked plugin files plus the built assets
# (everything except node_modules and other development-only files), under a
# top-level redmine_gtt/ directory.

on:
  release:
    types: [published]

permissions:
  contents: write
  issues: write

jobs:
  build-and-attach:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build assets
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable pnpm
          pnpm install --frozen-lockfile
          pnpm build

      - name: Create plugin archive
        run: |
          TAG="${{ github.event.release.tag_name }}"
          STAGING=$(mktemp -d)
          mkdir "$STAGING/redmine_gtt"
          # tracked files only (no node_modules, .git, caches)...
          git archive HEAD | tar -x -C "$STAGING/redmine_gtt"
          # ...plus the built assets, which are gitignored
          cp -R assets "$STAGING/redmine_gtt/"
          tar -czf "redmine_gtt-$TAG.tar.gz" -C "$STAGING" redmine_gtt
          tar -tzf "redmine_gtt-$TAG.tar.gz" | head -20

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          gh release upload "$TAG" "redmine_gtt-$TAG.tar.gz" --clobber
          # Also attach a stable-named copy so version-independent links
          # like .../releases/latest/download/redmine_gtt.tar.gz work
          # (used by the getting-started section on gtt-project.org).
          cp "redmine_gtt-$TAG.tar.gz" redmine_gtt.tar.gz
          gh release upload "$TAG" redmine_gtt.tar.gz --clobber

      - name: Ensure release announcement discussion
        # Linking the release to a discussion category makes GitHub create
        # an announcement post from the release notes (the same effect as
        # the "Create a discussion for this release" checkbox), so releases
        # always show up under https://github.com/orgs/gtt-project/discussions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE="repos/${{ github.repository }}/releases/${{ github.event.release.id }}"
          if [ "$(gh api "$RELEASE" --jq '.discussion_url // empty')" = "" ]; then
            gh api -X PATCH "$RELEASE" -f discussion_category_name=Announcements \
              --jq '"Created \(.discussion_url)"'
          else
            echo "Release already has a linked discussion"
          fi

      - name: Open a docs refresh issue
        # Screenshots and guides go stale silently; this leaves a visible
        # post-release reminder instead of relying on memory.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          gh issue create --repo "${{ github.repository }}" \
            --title "Docs refresh for $TAG" \
            --label documentation \
            --body "$(cat <<EOF
          Post-release documentation checklist for **$TAG**:

          - [ ] Screenshots in \`doc/\` still match the current UI (retake the outdated ones)
          - [ ] \`doc/getting-started.md\` walkthrough still matches the current UI and settings
          - [ ] \`doc/api.md\` covers API changes shipped in this release
          - [ ] \`README.md\` requirements and install steps are current
          - [ ] [gtt-project.org](https://gtt-project.org) is current (supported versions, features, screenshots)

          Close directly if nothing user-visible changed in this release.
          EOF
          )"
